{% if tasks %}
<div class="task-grid" style="display: grid; gap: 1rem;">
    {% for task in tasks %}
    <div class="card task-item priority-{{ task.priority }} {% if task.completed %}completed{% endif %}"
         id="task-{{ task.id }}">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-auto">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox"
                               {% if task.completed %}checked{% endif %}
                               onchange="updateTaskStatus({{ task.id }}, this.checked)">
                    </div>
                </div>
                <div class="col">
                    <h3 class="card-title {% if task.completed %}text-decoration-line-through{% endif %}">
                        {{ task.title }}
                    </h3>
                    {% if task.description %}
                    <p class="text-muted">{{ task.description }}</p>
                    {% endif %}
                    <div class="d-flex gap-2 mt-2">
                        <span class="badge bg-{{ task.priority|default:'secondary' }}">
                            {{ task.get_priority_display }}
                        </span>
                        <span class="badge bg-secondary">
                            {{ task.created_at|date:"d.m.Y H:i" }}
                        </span>
                    </div>
                </div>
                <div class="col-auto">
                    <button class="btn btn-danger btn-sm" onclick="deleteTask({{ task.id }})">
                        🗑️
                    </button>
                </div>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% else %}
<div class="text-center py-5">
    <p class="text-muted">Задач пока нет</p>
    <a href="{% url 'task_create' %}" class="btn btn-primary">Создать первую задачу</a>
</div>
{% endif %}
